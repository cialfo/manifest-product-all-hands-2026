<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product All Hands — September 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Literata:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      try {
        if (localStorage.getItem("ah26_theme") === "light")
          document.documentElement.classList.add("theme-light");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .ag-grid-v2 .ag-link:last-child:nth-child(3n+1) { grid-column: 3 / span 2; }
      .ag-grid-v2 .ag-link:nth-child(3n+1):nth-last-child(2) { grid-column: 2 / span 2; }
      .ag-grid-v2 .ag-link:last-child:nth-child(3n+2) { grid-column: 4 / span 2; }

      /* ── Outcome review: section opener ── */
      .ocx-wrap {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 1020px;
        padding: 0 2rem;
      }
      .ocx-logo {
        width: 250px;
        height: auto;
        display: block;
        margin-bottom: 2.6rem;
      }
      /* Same card language as the agenda cards: soft radius, hairline accent
         border, faintly tinted ground. */
      .ocx-card {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1.5px solid rgba(var(--accent-rgb), 0.28);
        border-radius: 16px;
        background: rgba(var(--accent-rgb), 0.03);
        padding: 4.6rem 4rem 4.7rem;
      }
      .ocx-title {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 78px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: 0.02em;
        color: var(--text-primary);
      }
      .ocx-title em { color: var(--accent); font-style: normal; }
      .ocx-rule {
        margin-top: 1.5rem;
        width: 72px;
        height: 2px;
        background: var(--accent);
        border-radius: 2px;
      }
      .ocx-quote {
        margin-top: 2.1rem;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-style: italic;
        font-size: 31px;
        font-weight: 400;
        line-height: 1.4;
        color: var(--text-secondary);
        max-width: 720px;
      }
      .ocx-quote em { color: var(--accent); font-style: italic; font-weight: 600; }
      /* ── Outcome review: per-section board ── */
      .oc-wrap {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.7rem;
        width: 100%;
        max-width: 1120px;
        padding: 0 2.5rem;
      }
      .oc-badge {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }
      .oc-logo { height: 38px; width: auto; display: block; }
      /* Squads with no product lockup get a typographic mark instead. */
      .oc-wordmark {
        font-family: "Montserrat", sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
        padding: 0.6rem 0;
      }
      .oc-badge-text {
        font-family: "Montserrat", sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .oc-title {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.14;
        color: var(--text-primary);
        text-align: center;
      }
      .oc-title em { color: var(--accent); font-style: italic; }
      .oc-rule {
        width: 64px;
        height: 1.5px;
        background: rgba(var(--accent-rgb), 0.5);
      }
      /* Section board: the four tiles sit inside one soft container, echoing
         the opener card but lighter — outer frame recedes, tiles stay solid. */
      .oc-card {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        border: 1.5px solid rgba(var(--accent-rgb), 0.22);
        border-radius: 20px;
        background: rgba(var(--accent-rgb), 0.015);
        padding: 1.5rem 1.6rem 1.6rem;
      }
      .oc-card .stat-grid { width: 100%; }
      .oc-wrap .stat-grid { gap: 14px; }
      .oc-wrap .stat-card { padding: 15px 18px; gap: 7px; }
      /* Tile headers read as headers, not as micro-labels. */
      .oc-wrap .stat-card-label {
        font-family: "Montserrat", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--text-primary);
        line-height: 1.25;
      }
      .oc-wrap .stat-before,
      .oc-wrap .stat-after { font-family: "Literata", Georgia, serif; }
      .oc-wrap .stat-before { font-size: 19px; font-style: normal; }
      .oc-wrap .stat-after { font-size: 30px; }
      .oc-wrap .stat-card-foot {
        font-family: "Literata", Georgia, serif;
        font-size: 14px;
        color: var(--text-primary);
      }
      .oc-ctx {
        margin-top: 1px;
        padding-top: 8px;
        border-top: 1px solid rgba(var(--accent-rgb), 0.2);
        font-family: "Literata", Georgia, serif;
        font-size: 12.5px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--text-primary);
      }
      .oc-ctx b {
        font-weight: 700;
        color: var(--accent);
      }
      .oc-note {
        font-family: "Montserrat", sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-secondary);
        opacity: 0;
        animation: fadein 0.6s ease forwards;
        animation-delay: 1.1s;
      }
    </style>
  </head>
  <body>
    <div id="bg">
      <div class="dots"></div>
    </div>
    <div id="progress"></div>
    <div id="stage">
      <!-- SLIDE 0: TITLE -->
      <div class="slide active">
        <div
          class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden"
        >
          <div class="dots"></div>
          <div class="s1-content">
            <div
              class="mg-frame"
              style="display: inline-flex; align-items: center; justify-content: center; padding: 2rem;"
            >
              <img
                src="Assets/Manifest-Global--Horizontal-Logo-SVG.png"
                alt="Manifest Global"
                style="width: 680px; height: auto; display: block"
              />
            </div>
            <div class="s1-bottom">
              <div class="s1-label">Product All Hands</div>
              <div class="s1-divider"></div>
              <div class="s1-date">September 2026</div>
            </div>
          </div>
        </div>
      </div>

      <!-- SLIDE 1: AGENDA -->
      <div class="slide" id="agenda">
        <div
          class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden"
          id="slide-agenda"
        >
          <div class="dots"></div>
          <div class="ag-header">
            <div class="ag-title">What We&#39;re <em>Building</em></div>
            <div class="ag-rule"></div>
          </div>
          <div class="ag-grid-v2" id="ag-grid">
            <!-- populated by inline script at bottom of file -->
          </div>
        </div>
      </div>
    </div>
    <!-- end #stage -->

    <button id="home-link" type="button" aria-label="Home">
      <svg viewBox="0 0 24 24">
        <path d="M3 11.5 12 4l9 7.5" />
        <path d="M6 10.5V20h12v-9.5" />
        <path d="M9.5 20v-6h5v6" />
      </svg>
    </button>
    <div id="slide-count"></div>
    <div id="hint">&#8592; &#8594; arrow keys to navigate</div>

    <a href="config.html" id="edit-btn" title="Configure agenda" aria-label="Configure agenda"
      >&#9881;</a
    >

    <script src="stories-index.js"></script>
    <script src="app.js"></script>
    <script>
      // Render the agenda grid from window.STORIES + saved config.
      // Stories appear in the user's configured order; section labels are
      // emitted whenever the section changes within that order.
      (function renderAgenda() {
        const grid = document.getElementById("ag-grid");
        if (!grid || !window.AH26) return;

        const config = window.AH26.loadConfig();
        const enabledIds = window.AH26.enabledInOrder(config);

        const esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
          );

        // Wrap standalone 4-digit years in s1-date style (Montserrat, bold, accent)
        const titleHtml = (s) =>
          esc(s)
            .replace(/\b(20\d{2})\b/g, '<span style="font-variant-numeric:lining-nums">$1</span>')
            .replace(/: /g, '<br>');

        const parts = [];
        let displayNum = 1;
        for (const id of enabledIds) {
          const story = window.AH26.findStory(id);
          if (!story) continue;
          const num = String(displayNum).padStart(2, "0");
          parts.push(
            `<a class="ag-link" href="${esc(story.file)}" data-topic="${esc(id)}">` +
              `<div class="ag-card">` +
              `<div class="ag-num">${num}</div>` +
              `<div class="ag-name">${titleHtml(story.title)}</div>` +
              `<div class="ag-speaker">${esc(story.author)}</div>` +
              `</div></a>`
          );
          displayNum++;
        }
        grid.innerHTML = parts.join("");
      })();

      if (location.hash === "#agenda" && typeof goTo === "function") {
        goTo(typeof agendaIndex === "function" ? agendaIndex() : 1);
      }
    </script>
  </body>
</html>
